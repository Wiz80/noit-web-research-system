[tool.poetry]
name = "noit-web-research-system"
version = "1.0.0"
description = "A comprehensive web research system powered by CrewAI and Perplexity."
authors = ["InfinityLab Research Team <research@infinitylab.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11, <=3.13"
fastapi = "0.115.14"
uvicorn = {extras = ["standard"], version = "0.34.3"}
python-multipart = "0.0.20"
sqlalchemy = "2.0.41"
alembic = "1.16.2"
psycopg2-binary = "2.9.10"
crewai = "0.134.0"
crewai-tools = "0.0.1"
langchain = "0.3.26"
langchain-openai = "0.3.27"
langchain-anthropic = "0.3.16"
langchain-google-genai = "2.1.5"
langchain-community = "0.3.26"
langchain-deepseek = "0.1.3"
minio = "7.2.15"
httpx = "0.28.1"
requests = "2.32.4"
pydantic = "2.11.7"
pydantic-settings = "2.10.1"
python-dateutil = "2.9.0.post0"
python-dotenv = "1.1.1"
structlog = "25.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.1"
pytest-asyncio = "1.0.0"
black = "25.1.0"
isort = "6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 