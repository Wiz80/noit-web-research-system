  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5

  # Web Research System (optional - for containerized deployment)
  # web-research-api:
  #   build: .
  #   container_name: web_research_api
