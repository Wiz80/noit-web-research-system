version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: web_research_postgres
    command: postgres -c listen_addresses='*'
    environment:
      POSTGRES_DB: web_research_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d web_research_db"]
      interval: 30s
      timeout: 10s
      retries: 5

